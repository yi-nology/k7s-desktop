[package]
name = "k7s"
version.workspace = true
description = "k7s — a Lens-style Kubernetes visual monitor"
authors.workspace = true
edition.workspace = true
default-run = "k7s"
# Workspace pins 1.77.2: tauri-plugin-window-state 2.x declares it, and cargo
# silently downgrades that plugin to a v0.1.1 built for Tauri v1 below that.
rust-version.workspace = true

# The library crate holds all app logic (commands, kube plumbing) so it can be
# unit-tested with `cargo test`; main.rs is a thin binary that calls into it.
[lib]
name = "k7s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# --- Tauri shell ---
tauri.workspace = true
tauri-plugin-shell.workspace = true
# Native file-open dialog for the "Import kubeconfig" action.
tauri-plugin-dialog.workspace = true
# Remembers window size/position/monitor across launches (B22).
tauri-plugin-window-state.workspace = true

# --- Internal crates (path deps inside the workspace) ---
k7s-deps.workspace = true
k7s-core = { workspace = true, features = ["tauri"] }
k7s-server.workspace = true

# --- Proc-macro dependencies (must be in extern prelude) ---
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
# Reserved for future custom-protocol tweaks; kept so tauri.conf can reference it.
custom-protocol = ["tauri/custom-protocol"]
# Browser mode: delegates to k7s-server's web feature.
web = ["k7s-server/web"]
# MCP mode: delegates to k7s-server's mcp feature.
mcp = ["k7s-server/mcp"]

# Only the Tauri desktop binary lives here.
# k7s-web and k7s-mcp live in the k7s-server crate.
[[bin]]
name = "k7s"
path = "src/main.rs"

[dev-dependencies]
proptest.workspace = true
tower.workspace = true
http-body-util.workspace = true
